<!doctype html>
<!-- A complete settings screen in a native-app style: grouped inset lists, icon
     tiles, switches, values, a segmented theme picker with Automatic, a
     destructive row. No dependencies; open in a browser (try dark mode,
     375px width, keyboard only). -->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Settings</title>
<style>
  :root {
    color-scheme: light dark;
    --color-bg: light-dark(#f2f2f7, #000);
    --color-surface: light-dark(#fff, #1c1c1e);
    --color-surface-2: light-dark(#e5e5ea, #2c2c2e);
    --color-text: light-dark(#000, #fff);
    --color-text-muted: light-dark(#6c6c70, #98989d);
    --color-separator: light-dark(rgb(60 60 67 / 0.29), rgb(84 84 88 / 0.6));
    --color-accent: light-dark(#007aff, #0a84ff);
    --color-danger: light-dark(#ff3b30, #ff453a);
    --color-success: light-dark(#34c759, #30d158);
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--color-bg);
    color: var(--color-text);
    font: 1.0625rem/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 32px);
  }
  main { max-width: 640px; margin: 0 auto; padding: 0 16px; }
  h1 { font-size: 2.125rem; line-height: 1.2; letter-spacing: -0.02em; margin: 24px 4px 16px; }

  .group { margin-bottom: 32px; }
  .group-header { margin: 0 16px 6px; font-size: 0.8125rem; font-weight: 400; text-transform: uppercase; color: var(--color-text-muted); }
  .group-footer { margin: 6px 16px 0; font-size: 0.8125rem; color: var(--color-text-muted); }
  .group-body { background: var(--color-surface); border-radius: 10px; overflow: hidden; }

  .row {
    position: relative; display: flex; align-items: center; gap: 12px;
    min-height: 44px; padding: 8px 16px; width: 100%;
    background: none; border: 0; font: inherit; color: inherit; text-align: start; text-decoration: none; cursor: pointer;
  }
  .row:active { background: var(--color-surface-2); }
  .row:focus-visible { outline: 2px solid var(--color-accent); outline-offset: -2px; }
  /* Inset separator: starts after the icon tile, like native settings lists. */
  .row + .row::before {
    content: ""; position: absolute; top: 0; inset-inline-end: 0;
    inset-inline-start: 57px; border-top: 0.5px solid var(--color-separator);
  }
  .row-label { flex: 1; }
  .row-value { color: var(--color-text-muted); }
  .chevron { width: 8px; height: 13px; color: var(--color-text-muted); opacity: 0.6; }
  [dir="rtl"] .chevron { transform: scaleX(-1); }
  .row.danger { color: var(--color-danger); justify-content: center; }
  .row.danger::before { inset-inline-start: 0; }

  .icon-tile { flex-shrink: 0; width: 29px; height: 29px; border-radius: 7px; display: grid; place-items: center; color: #fff; }
  .icon-tile svg { width: 18px; height: 18px; }

  /* Switch */
  .switch { appearance: none; flex-shrink: 0; width: 51px; height: 31px; border-radius: 999px; background: var(--color-surface-2); position: relative; cursor: pointer; transition: background 200ms; margin: 0; }
  .switch::after { content: ""; position: absolute; top: 2px; inset-inline-start: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgb(0 0 0 / 0.15), 0 1px 1px rgb(0 0 0 / 0.16); transition: transform 200ms; }
  .switch:checked { background: var(--color-success); }
  .switch:checked::after { transform: translateX(20px); }
  [dir="rtl"] .switch:checked::after { transform: translateX(-20px); }
  .switch:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

  /* Segmented control */
  .segmented { display: flex; margin: 12px 16px; padding: 2px; border-radius: 9px; background: var(--color-surface-2); }
  .segmented button { flex: 1; min-height: 32px; border: 0; border-radius: 7px; background: none; color: inherit; font: inherit; font-size: 0.8125rem; font-weight: 500; cursor: pointer; }
  .segmented button[aria-checked="true"] { background: var(--color-surface); box-shadow: 0 3px 8px rgb(0 0 0 / 0.12), 0 3px 1px rgb(0 0 0 / 0.04); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) { .switch, .switch::after { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Settings</h1>

  <section class="group" aria-labelledby="g-appearance">
    <h2 class="group-header" id="g-appearance">Appearance</h2>
    <div class="group-body">
      <div class="segmented" role="radiogroup" aria-label="Theme">
        <button type="button" role="radio" aria-checked="false" data-mode="light">Light</button>
        <button type="button" role="radio" aria-checked="false" data-mode="dark">Dark</button>
        <button type="button" role="radio" aria-checked="true" data-mode="system">Automatic</button>
      </div>
    </div>
    <p class="group-footer">Automatic follows your device and switches with it.</p>
  </section>

  <section class="group" aria-labelledby="g-general">
    <h2 class="group-header" id="g-general">General</h2>
    <div class="group-body">
      <label class="row">
        <span class="icon-tile" style="background:#ff3b30" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 3.5a5.5 5.5 0 0 0-5.5 5.5v3.6L5 15.5h14l-1.5-2.9V9A5.5 5.5 0 0 0 12 3.5Z" fill="currentColor"/><path d="M10 18a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </span>
        <span class="row-label">Notifications</span>
        <input type="checkbox" role="switch" class="switch" checked />
      </label>
      <label class="row">
        <span class="icon-tile" style="background:#ff2d55" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4v-5Z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </span>
        <span class="row-label">Sounds</span>
        <input type="checkbox" role="switch" class="switch" />
      </label>
      <a class="row" href="#language">
        <span class="icon-tile" style="background:#007aff" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.9"/><path d="M3.5 12h17M12 3.5c2.4 2.4 3.6 5.2 3.6 8.5s-1.2 6.1-3.6 8.5c-2.4-2.4-3.6-5.2-3.6-8.5S9.6 5.9 12 3.5Z" stroke="currentColor" stroke-width="1.9"/></svg>
        </span>
        <span class="row-label">Language</span>
        <span class="row-value">English</span>
        <svg class="chevron" viewBox="0 0 8 13" aria-hidden="true"><path d="m1.5 1.5 5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>
    <p class="group-footer">Reminders reach this device even when the app is closed.</p>
  </section>

  <section class="group" aria-label="Account">
    <div class="group-body">
      <button type="button" class="row danger">Delete Account</button>
    </div>
  </section>
</main>
<script>
  // Theme: Light / Dark / Automatic (default), applied instantly.
  const root = document.documentElement;
  const buttons = document.querySelectorAll('.segmented button');
  function apply(mode) {
    if (mode === 'system') delete root.dataset.theme;
    else root.dataset.theme = mode;
    buttons.forEach((b) => b.setAttribute('aria-checked', String(b.dataset.mode === mode)));
  }
  buttons.forEach((b) => b.addEventListener('click', () => apply(b.dataset.mode)));
  // One tab stop, arrow keys move the selection.
  document.querySelector('.segmented').addEventListener('keydown', (e) => {
    const list = [...buttons];
    const i = list.findIndex((b) => b.getAttribute('aria-checked') === 'true');
    const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
    if (!step) return;
    e.preventDefault();
    const next = list[(i + step + list.length) % list.length];
    apply(next.dataset.mode);
    next.focus();
  });
</script>
</body>
</html>
