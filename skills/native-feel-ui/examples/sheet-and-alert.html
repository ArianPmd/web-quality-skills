<!doctype html>
<!-- A sheet (Cancel / title / Save) with a form, an unsaved-changes action
     sheet, a destructive alert, and a toast with Undo. Focus is trapped in
     open dialogs, Escape closes, focus returns to the trigger. No
     dependencies; open in a browser. -->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sheet and alert</title>
<style>
  :root {
    color-scheme: light dark;
    --color-bg: light-dark(#f2f2f7, #000);
    --color-surface: light-dark(#fff, #1c1c1e);
    --color-surface-2: light-dark(#e5e5ea, #2c2c2e);
    --color-text: light-dark(#000, #fff);
    --color-text-muted: light-dark(#6c6c70, #98989d);
    --color-separator: light-dark(rgb(60 60 67 / 0.29), rgb(84 84 88 / 0.6));
    --color-accent: light-dark(#007aff, #0a84ff);
    --color-danger: light-dark(#ff3b30, #ff453a);
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; background: var(--color-bg); color: var(--color-text); font: 1.0625rem/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px; display: grid; gap: 12px; }
  .btn { min-height: 44px; padding: 0 18px; border: 0; border-radius: 12px; font: inherit; font-weight: 600; cursor: pointer; background: var(--color-accent); color: #fff; }
  .btn.plain { background: var(--color-surface); color: var(--color-danger); }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

  .backdrop { position: fixed; inset: 0; background: rgb(0 0 0 / 0.4); display: grid; align-items: end; justify-items: center; animation: fade 200ms ease-out; z-index: 10; }
  .backdrop.center { align-items: center; }
  .sheet { width: 100%; max-width: 640px; max-height: 92dvh; display: flex; flex-direction: column; background: var(--color-bg); border-radius: 14px 14px 0 0; padding-bottom: env(safe-area-inset-bottom); animation: up 280ms cubic-bezier(0.2, 0.8, 0.2, 1); }
  .sheet-header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 14px 16px; border-bottom: 0.5px solid var(--color-separator); }
  .sheet-header h2 { margin: 0; font-size: 1.0625rem; font-weight: 600; }
  .sheet-header .text-btn { background: none; border: 0; color: var(--color-accent); font: inherit; min-height: 44px; cursor: pointer; }
  .sheet-header .text-btn:last-child { justify-self: end; font-weight: 600; }
  .sheet-header .text-btn:disabled { color: var(--color-text-muted); cursor: default; }
  .sheet-body { overflow: auto; padding: 16px; display: grid; gap: 16px; }
  label { display: grid; gap: 6px; font-size: 0.8125rem; color: var(--color-text-muted); }
  input, textarea { font: inherit; font-size: 1.0625rem; /* ≥16px: no iOS zoom */ color: var(--color-text); background: var(--color-surface); border: 0; border-radius: 10px; padding: 11px 14px; min-height: 44px; }
  .counter { justify-self: end; font-size: 0.75rem; }

  .alert { width: min(270px, calc(100vw - 48px)); background: color-mix(in srgb, var(--color-surface) 92%, transparent); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-radius: 14px; text-align: center; overflow: hidden; animation: pop 200ms ease-out; }
  .alert h2 { margin: 18px 16px 4px; font-size: 1.0625rem; }
  .alert p { margin: 0 16px 18px; font-size: 0.8125rem; color: var(--color-text-muted); }
  .alert-actions { display: grid; border-top: 0.5px solid var(--color-separator); }
  .alert-actions button { min-height: 44px; border: 0; background: none; font: inherit; color: var(--color-accent); cursor: pointer; }
  .alert-actions button + button { border-top: 0.5px solid var(--color-separator); }
  .alert-actions .destructive { color: var(--color-danger); }
  .alert-actions .default { font-weight: 600; }

  .toast { position: fixed; inset-inline: 16px; top: calc(env(safe-area-inset-top) + 12px); margin: 0 auto; max-width: 420px; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 14px; background: var(--color-surface); box-shadow: 0 8px 30px rgb(0 0 0 / 0.18); animation: down 250ms cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 20; }
  .toast span { flex: 1; }
  .toast button { border: 0; background: none; color: var(--color-accent); font: inherit; font-weight: 600; min-height: 44px; cursor: pointer; }

  @keyframes fade { from { opacity: 0; } }
  @keyframes up { from { transform: translateY(100%); } }
  @keyframes pop { from { transform: scale(1.1); opacity: 0; } }
  @keyframes down { from { transform: translateY(-120%); } }
  @media (prefers-reduced-motion: reduce) { .backdrop, .sheet, .alert, .toast { animation: fade 120ms ease-out; } }
</style>
</head>
<body>
<main>
  <button type="button" class="btn" id="open-sheet">New Item</button>
  <button type="button" class="btn plain" id="open-delete">Delete Item</button>
</main>

<template id="tpl-sheet">
  <div class="backdrop" data-close>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-header">
        <button type="button" class="text-btn" data-cancel>Cancel</button>
        <h2 id="sheet-title">New Item</h2>
        <button type="button" class="text-btn" data-save disabled>Save</button>
      </div>
      <form class="sheet-body">
        <label>Title
          <input name="title" maxlength="28" autocomplete="off" enterkeyhint="next" required />
          <span class="counter" aria-live="polite">0/28</span>
        </label>
        <label>Notes <textarea name="notes" rows="3"></textarea></label>
      </form>
    </div>
  </div>
</template>

<template id="tpl-alert">
  <div class="backdrop center">
    <div class="alert" role="alertdialog" aria-modal="true" aria-labelledby="alert-title" aria-describedby="alert-msg">
      <h2 id="alert-title"></h2>
      <p id="alert-msg"></p>
      <div class="alert-actions"></div>
    </div>
  </div>
</template>

<script>
  // Minimal dialog helper: portal to body, trap focus, Escape, restore focus.
  function openDialog(node, { onEscape, initial }) {
    const trigger = document.activeElement;
    document.body.append(node);
    const focusables = () => [...node.querySelectorAll('button:not([disabled]), input, textarea, [tabindex]:not([tabindex="-1"])')];
    (node.querySelector(initial) ?? focusables()[0])?.focus();
    node.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { e.stopPropagation(); onEscape(); }
      if (e.key !== 'Tab') return;
      const f = focusables(); const first = f[0]; const last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });
    return () => { node.remove(); trigger?.focus(); };
  }

  // Alert / action sheet: Cancel is the default focus, destructive is red.
  function alertBox({ title, message, actions }) {
    const node = document.getElementById('tpl-alert').content.firstElementChild.cloneNode(true);
    node.querySelector('h2').textContent = title;
    node.querySelector('p').textContent = message ?? '';
    let close;
    for (const a of actions) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = a.label;
      if (a.style) b.className = a.style;
      if (a.cancel) b.dataset.cancel = '';
      b.addEventListener('click', () => { close(); a.run?.(); });
      node.querySelector('.alert-actions').append(b);
    }
    const cancel = actions.find((a) => a.cancel);
    close = openDialog(node, { onEscape: () => { close(); cancel?.run?.(); }, initial: '[data-cancel]' });
  }

  function toast(text, undo) {
    document.querySelector('.toast')?.remove();
    const t = document.createElement('div');
    t.className = 'toast'; t.setAttribute('role', 'status');
    t.innerHTML = '<span></span>';
    t.querySelector('span').textContent = text;
    if (undo) {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Undo';
      b.addEventListener('click', () => { t.remove(); undo(); });
      t.append(b);
    }
    document.body.append(t);
    setTimeout(() => t.remove(), 4000);
  }

  document.getElementById('open-sheet').addEventListener('click', () => {
    const node = document.getElementById('tpl-sheet').content.firstElementChild.cloneNode(true);
    const title = node.querySelector('input[name=title]');
    const notes = node.querySelector('textarea');
    const save = node.querySelector('[data-save]');
    const dirty = () => title.value.trim() !== '' || notes.value.trim() !== '';
    title.addEventListener('input', () => {
      node.querySelector('.counter').textContent = `${title.value.length}/28`;
      save.disabled = !title.value.trim();
    });
    let close;
    const requestClose = () => {
      if (!dirty()) return close();
      alertBox({
        title: 'Discard this item?',
        actions: [
          { label: 'Discard Changes', style: 'destructive', run: () => close() },
          { label: 'Keep Editing', cancel: true, style: 'default' },
        ],
      });
    };
    node.querySelector('[data-cancel]').addEventListener('click', requestClose);
    node.addEventListener('click', (e) => { if (e.target === node) requestClose(); });
    save.addEventListener('click', () => { close(); toast('Saved'); });
    node.querySelector('form').addEventListener('submit', (e) => { e.preventDefault(); if (!save.disabled) save.click(); });
    close = openDialog(node, { onEscape: requestClose, initial: 'input' });
  });

  document.getElementById('open-delete').addEventListener('click', () => {
    alertBox({
      title: 'Delete this item?',
      message: 'It moves to Trash for 30 days.',
      actions: [
        { label: 'Delete', style: 'destructive', run: () => toast('Moved to Trash', () => toast('Restored')) },
        { label: 'Cancel', cancel: true, style: 'default' },
      ],
    });
  });
</script>
</body>
</html>
